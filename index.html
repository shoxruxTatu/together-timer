<meta charset="UTF-8">
<title>Since August Seventh</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Work+Sans:wght@400;500;600&display=swap');

  :root{
    --bg:#fbf1ee;
    --bg2:#f4dcd6;
    --surface:#fff9f6;
    --ink:#3a1c2b;
    --ink-dim:#8a6470;
    --gold:#a97a3d;
    --gold-soft:#d8b784;
    --rose:#c66e7c;
    --rose-soft:#e9b9bf;
    --line: rgba(58,28,43,0.14);
    --shadow: rgba(58,28,43,0.10);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#241019;
      --bg2:#3c1d2e;
      --surface:#2f1520;
      --ink:#f7ece6;
      --ink-dim:#cba9b5;
      --gold:#e0b673;
      --gold-soft:#caa06a;
      --rose:#e2909c;
      --rose-soft:#c97b8a;
      --line: rgba(247,236,230,0.16);
      --shadow: rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#241019;
    --bg2:#3c1d2e;
    --surface:#2f1520;
    --ink:#f7ece6;
    --ink-dim:#cba9b5;
    --gold:#e0b673;
    --gold-soft:#caa06a;
    --rose:#e2909c;
    --rose-soft:#c97b8a;
    --line: rgba(247,236,230,0.16);
    --shadow: rgba(0,0,0,0.35);
  }

  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 60% 40% at 15% 0%, color-mix(in srgb, var(--rose) 22%, transparent), transparent 60%),
      radial-gradient(ellipse 55% 45% at 100% 10%, color-mix(in srgb, var(--gold) 20%, transparent), transparent 65%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    color:var(--ink);
    font-family:'Work Sans', ui-sans-serif, system-ui, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding: 64px 20px 80px;
  }

  .page{
    width:100%;
    max-width:640px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:56px;
  }

  .eyebrow{
    font-size:12px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--ink-dim);
    font-weight:600;
  }

  /* ---- Hero ---- */
  .hero{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:14px;
  }
  .hero .eyebrow{margin-bottom:2px;}
  .hero .date{
    font-family:'Fraunces', Georgia, serif;
    font-style:italic;
    font-weight:400;
    font-size:19px;
    color:var(--ink-dim);
  }
  .hero .date b{
    font-style:normal;
    font-weight:600;
    color:var(--ink);
  }

  /* ---- Timer ---- */
  .timer{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap: clamp(10px, 3vw, 26px);
    flex-wrap:wrap;
    padding-top:8px;
  }
  .stat{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    min-width:64px;
  }
  .stat .num{
    font-family:'Fraunces', Georgia, serif;
    font-weight:600;
    font-optical-sizing:auto;
    font-size:clamp(40px, 11vw, 68px);
    line-height:1;
    font-variant-numeric: tabular-nums;
    background:linear-gradient(160deg, var(--ink) 30%, var(--rose) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    display:inline-block;
  }
  .stat .num.bump{ animation: num-pop .45s cubic-bezier(.34,1.56,.64,1); }
  @keyframes num-pop{
    0%{ transform:scale(1); }
    35%{ transform:scale(1.16); }
    100%{ transform:scale(1); }
  }
  .stat .lbl{
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-dim);
    font-weight:600;
  }
  .colon{
    font-family:'Fraunces', Georgia, serif;
    font-size:clamp(28px, 7vw, 44px);
    color:var(--gold-soft);
    align-self:flex-start;
    margin-top:2px;
    transform:translateY(6px);
  }
  .seconds-row{
    font-size:13px;
    color:var(--ink-dim);
    font-variant-numeric: tabular-nums;
  }
  .seconds-row .s-num{color:var(--gold);font-weight:600;display:inline-block;}
  .seconds-row .s-num.tick{ animation: s-pop .4s ease; }
  @keyframes s-pop{
    0%{ opacity:.5; transform:scale(.88); }
    100%{ opacity:1; transform:scale(1); }
  }

  /* ---- Divider ---- */
  .divider{
    width:100%;
    display:flex;
    align-items:center;
    gap:14px;
    color:var(--gold-soft);
  }
  .divider::before,.divider::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }
  .divider svg{width:16px;height:16px;flex:none;transform-origin:center;animation:heartbeat 2.6s ease-in-out infinite;}
  @keyframes heartbeat{
    0%,100%{ transform:scale(1); }
    15%{ transform:scale(1.18); }
    30%{ transform:scale(1); }
    45%{ transform:scale(1.12); }
    60%{ transform:scale(1); }
  }

  /* ---- Daily message ---- */
  .message-block{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:16px;
    max-width:520px;
  }
  .message-block .day-tag{
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:600;
  }
  .message{
    font-family:'Fraunces', Georgia, serif;
    font-style:italic;
    font-weight:400;
    font-size:clamp(20px, 4.4vw, 27px);
    line-height:1.45;
    color:var(--ink);
    text-wrap:balance;
    transition:opacity .5s ease, transform .5s ease;
  }
  .message::before{content:"“";}
  .message::after{content:"”";}

  /* ---- Scratch card ---- */
  .card-block{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }
  .card-block .eyebrow{color:var(--gold);}
  .scratch-wrap{
    position:relative;
    width:296px;
    max-width:78vw;
    aspect-ratio: 4 / 5;
    border-radius:18px;
    overflow:hidden;
    box-shadow: 0 18px 40px -12px var(--shadow), 0 0 0 1px var(--line);
    background:var(--surface);
    touch-action:none;
    cursor:pointer;
  }
  .photo-layer{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .photo-layer.placeholder{
    background:
      radial-gradient(circle at 30% 25%, color-mix(in srgb, var(--rose-soft) 70%, transparent), transparent 55%),
      radial-gradient(circle at 75% 70%, color-mix(in srgb, var(--gold-soft) 60%, transparent), transparent 55%),
      linear-gradient(160deg, var(--surface), var(--bg2));
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .photo-layer.placeholder svg{width:38%;opacity:0.55;}
  .scratch-canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
  }
  .scratch-caption{
    font-size:12px;
    color:var(--ink-dim);
    letter-spacing:0.02em;
    min-height:16px;
    transition:opacity .4s ease;
  }
  .scratch-caption.done{color:var(--gold);font-weight:600;}

  /* ---- Ambient floating hearts ---- */
  .heart-field{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
  }
  .drift-heart{
    position:absolute;
    bottom:-40px;
    width:16px;
    height:16px;
    color:var(--rose-soft);
    opacity:0;
    animation-name:heart-rise;
    animation-timing-function:ease-in;
    animation-iteration-count:infinite;
  }
  .drift-heart svg{width:100%;height:100%;display:block;}
  @keyframes heart-rise{
    0%{ transform:translateY(0) translateX(0) rotate(0deg); opacity:0; }
    10%{ opacity:0.55; }
    85%{ opacity:0.4; }
    100%{ transform:translateY(-112vh) translateX(var(--drift-x,20px)) rotate(24deg); opacity:0; }
  }

  /* ---- Confetti / burst canvas ---- */
  #fxCanvas{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    pointer-events:none;
    z-index:50;
  }

  .page{ position:relative; z-index:1; }

  /* ---- Entrance reveal ---- */
  .reveal{
    opacity:0;
    transform:translateY(16px);
    animation: reveal-up 0.8s cubic-bezier(.16,.84,.44,1) forwards;
  }
  @keyframes reveal-up{
    to{ opacity:1; transform:none; }
  }
  .reveal-1{animation-delay:.05s;}
  .reveal-2{animation-delay:.18s;}
  .reveal-3{animation-delay:.32s;}
  .reveal-4{animation-delay:.42s;}
  .reveal-5{animation-delay:.52s;}
  .reveal-6{animation-delay:.62s;}
  .reveal-7{animation-delay:.70s;}
  .reveal-8{animation-delay:.78s;}
  .reveal-9{animation-delay:.86s;}
  .reveal-10{animation-delay:.94s;}

  /* ---- Mini game ---- */
  .game-block{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
    width:100%;
  }
  .game-sub{
    margin:0;
    font-size:12px;
    letter-spacing:0.08em;
    color:var(--ink-dim);
  }
  .profile-picker{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
  }
  .profile-options{
    display:flex;
    gap:14px;
  }
  .profile-btn{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    padding:14px 24px;
    border-radius:16px;
    border:1px solid var(--line);
    background:var(--surface);
    font-size:30px;
    line-height:1;
    cursor:pointer;
    box-shadow:0 10px 24px -14px var(--shadow);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .profile-btn span{
    font-size:10px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--ink-dim);
    font-weight:600;
  }
  .profile-btn:hover{ transform:translateY(-2px); }

  .game-area{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    width:100%;
  }
  .game-wrap{
    position:relative;
    width:min(300px, 82vw);
    aspect-ratio:3/4;
    border-radius:20px;
    overflow:hidden;
    box-shadow: 0 18px 40px -12px var(--shadow), 0 0 0 1px var(--line);
    background:
      radial-gradient(circle at 25% 15%, color-mix(in srgb, var(--rose-soft) 55%, transparent), transparent 55%),
      radial-gradient(circle at 80% 75%, color-mix(in srgb, var(--gold-soft) 45%, transparent), transparent 55%),
      linear-gradient(160deg, var(--surface), var(--bg2));
    touch-action:none;
    user-select:none;
  }
  #gameCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
  }
  .game-overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
    text-align:center;
    background:color-mix(in srgb, var(--surface) 70%, transparent);
    transition:opacity .25s ease;
  }
  .game-overlay.hidden{
    opacity:0;
    pointer-events:none;
  }
  .overlay-emoji{ font-size:44px; }
  .game-hint{
    margin:0;
    font-size:11px;
    color:var(--ink-dim);
  }

  .btn{
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:12px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:10px 26px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    color:#fff8f3;
    background:linear-gradient(135deg, var(--rose), var(--gold));
    box-shadow:0 10px 22px -10px var(--shadow);
    transition:transform .2s ease;
  }
  .btn:hover{ transform:translateY(-1px); }
  .btn:active{ transform:translateY(0); }

  .link-btn{
    background:none;
    border:none;
    padding:0;
    font-size:11px;
    color:var(--ink-dim);
    text-decoration:underline;
    cursor:pointer;
  }

  .game-hud{
    display:flex;
    gap:24px;
    font-size:12px;
    letter-spacing:0.04em;
    color:var(--ink-dim);
    font-variant-numeric:tabular-nums;
  }
  .game-hud b{
    color:var(--ink);
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:15px;
    margin-left:4px;
  }

  .leaderboard{
    width:min(300px, 82vw);
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:16px 20px;
    border-radius:16px;
    background:var(--surface);
    box-shadow:0 10px 26px -16px var(--shadow), 0 0 0 1px var(--line);
  }
  .lb-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .lb-emoji{ font-size:17px; }
  .lb-name{
    flex:1;
    font-size:12px;
    color:var(--ink-dim);
  }
  .lb-score{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:17px;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .lb-row.leading .lb-score{ color:var(--rose); }
  .lb-sync{
    margin:2px 0 0;
    font-size:10px;
    text-align:center;
    color:var(--ink-dim);
    opacity:0.75;
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important;}
    .drift-heart{display:none;}
    .reveal{opacity:1 !important; transform:none !important;}
  }
</style>

<canvas id="fxCanvas" aria-hidden="true"></canvas>

<script>
(function(){
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- Ambient floating hearts ----------
  (function initHeartField(){
    if(reduceMotion) return;
    var field = document.getElementById('heartField');
    var count = 12;
    for(var i=0;i<count;i++){
      var h = document.createElement('div');
      h.className = 'drift-heart';
      var left = Math.random()*100;
      var size = 10 + Math.random()*14;
      var duration = 14 + Math.random()*10;
      var delay = Math.random()*duration * -1;
      var driftX = (Math.random()*80 - 40) + 'px';
      h.style.left = left + 'vw';
      h.style.width = size + 'px';
      h.style.height = size + 'px';
      h.style.animationDuration = duration + 's';
      h.style.animationDelay = delay + 's';
      h.style.setProperty('--drift-x', driftX);
      h.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.7-10-9.3C.4 8 2 4.5 5.6 4c2.2-.3 4 .8 6.4 3.3C14.4 4.8 16.2 3.7 18.4 4c3.6.5 5.2 4 3.6 7.7C19.5 16.3 12 21 12 21z"/></svg>';
      field.appendChild(h);
    }
  })();

  // ---------- Confetti / heart burst ----------
  var fxCanvas = document.getElementById('fxCanvas');
  var fxCtx = fxCanvas.getContext('2d');
  var fxDpr = Math.min(window.devicePixelRatio || 1, 2);
  var fxParticles = [];
  var fxRunning = false;
  var confettiColors = ['#c66e7c', '#e9b9bf', '#a97a3d', '#d8b784', '#f5e9e3', '#e0748f'];

  function sizeFxCanvas(){
    fxCanvas.width = window.innerWidth * fxDpr;
    fxCanvas.height = window.innerHeight * fxDpr;
    fxCanvas.style.width = window.innerWidth + 'px';
    fxCanvas.style.height = window.innerHeight + 'px';
  }
  sizeFxCanvas();
  window.addEventListener('resize', sizeFxCanvas);

  function heartPath(ctx, size){
    ctx.beginPath();
    ctx.moveTo(0, size*0.3);
    ctx.bezierCurveTo(0, 0, -size*0.5, 0, -size*0.5, size*0.3);

        vy: Math.sin(angle)*speed*0.7 - (3 + Math.random()*4),
        gravity: 0.045 + Math.random()*0.035,
        drag: 0.985,
        rot: Math.random()*Math.PI*2,
        vrot: (Math.random()-0.5)*0.35,

  // ---------- Scratch card ----------
  var wrap = document.getElementById('scratchWrap');
  var canvas = document.getElementById('scratchCanvas');

    canvas.style.height = rect.height + 'px';

  function drawFoil(){
    var w = canvas.width, h = canvas.height;
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0,0,w,h);

    var grad = ctx.createLinearGradient(0,0,w,h);
    grad.addColorStop(0, '#cfa15c');
    grad.addColorStop(0.5, '#e6c07f');
    grad.addColorStop(1, '#c9808f');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,w,h);

    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    for(var i=0;i<220;i++){
      var rx = Math.random()*w, ry = Math.random()*h, rr = Math.random()*1.6*dpr;

      ctx.fill();
    }
    ctx.fillStyle = 'rgba(60,20,30,0.06)';
    for(var j=0;j<160;j++){

      ctx.beginPath();
      ctx.arc(rx2,ry2,rr2,0,Math.PI*2);
      ctx.fill();
    }

    // label
    ctx.save();
    ctx.translate(w/2, h/2);
    ctx.rotate(-0.06);
    ctx.fillStyle = 'rgba(60,25,20,0.55)';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = (14*dpr) + 'px "Work Sans", sans-serif';
    ctx.fillText('scratch here', 0, -6*dpr);

        total++;
        if(data[idx] < 40) cleared++;
      }

    var pct = cleared/total;
    if(pct > 0.45){

    }
  }

  }
  function moveDraw(e){
    if(!drawing || revealed) return;
    var p = getPos(e);
    scratchAt(p.x, p.y);
    moveCount++;
    if(moveCount % 4 === 0) checkReveal();
    e.preventDefault();
  }
  function endDraw(){
    if(drawing) checkReveal();
    drawing = false;
  }

  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', moveDraw);
  window.addEventListener('mouseup', endDraw);
  canvas.addEventListener('touchstart', startDraw, {passive:false});
  canvas.addEventListener('touchmove', moveDraw, {passive:false});
  canvas.addEventListener('touchend', endDraw);

  // keyboard / accessibility fallback
  wrap.setAttribute('tabindex','0');
  wrap.setAttribute('role','button');
  wrap.setAttribute('aria-label','Scratch card, press Enter to reveal');
  wrap.addEventListener('keydown', function(e){
    if((e.key === 'Enter' || e.key === ' ') && !revealed){
      revealCard();
      e.preventDefault();
    }
  });
})();

    var minY = GAP/2 + 18;
    var maxY = H - GAP/2 - 18;

  function update(dt){

    if(pipes.length && pipes[0].x < -PIPE_W) pipes.shift();

      spawnPipe(last.x + Math.max(170, W * 0.68));

    for(var j=0;j<pipes.length;j++){
      var p = pipes[j];
      if(!p.passed && p.x + PIPE_W < bird.x){
        p.passed = true;
        score++;
        liveScoreEl.textContent = String(score);

      var overlapsX = bird.x + bird.r > p.x && bird.x - bird.r < p.x + PIPE_W;
      if(overlapsX){
        var hitsTop = bird.y - bird.r < p.gapY - GAP/2;
        var hitsBottom = bird.y + bird.r > p.gapY + GAP/2;
        if(hitsTop || hitsBottom){
          endRound();
          return;
        }
      }

    if(bird.y - bird.r < 0){ bird.y = bird.r; bird.vy = 0; }
    if(bird.y + bird.r > H){ endRound(); return; }

    gctx.lineTo(x+w-tr, y);
    gctx.quadraticCurveTo(x+w, y, x+w, y+tr);
    gctx.lineTo(x+w, y+h-br);
    gctx.quadraticCurveTo(x+w, y+h, x+w-br, y+h);
    gctx.lineTo(x+bl, y+h);
    gctx.quadraticCurveTo(x, y+h, x, y+h-bl);
    gctx.lineTo(x, y+tl);
    gctx.quadraticCurveTo(x, y, x+tl, y);
    gctx.closePath();
    gctx.fill();
  }

  function drawPipe(p){
    var topH = p.gapY - GAP/2;
    var botY = p.gapY + GAP/2;
    var botH = H - botY;
    var grad = gctx.createLinearGradient(p.x, 0, p.x + PIPE_W, 0);
    grad.addColorStop(0, 'rgba(201,112,124,0.88)');
    grad.addColorStop(1, 'rgba(216,183,132,0.88)');
    gctx.fillStyle = grad;
    roundRectPath(p.x, 0, PIPE_W, Math.max(0,topH), 14, false, true);
    roundRectPath(p.x, botY, PIPE_W, Math.max(0,botH), 14, true, false);
  }

  function drawFrame(){
    if(!W || !H) return;
    gctx.clearRect(0,0,W,H);
    for(var i=0;i<pipes.length;i++) drawPipe(pipes[i]);

    gctx.save();
    gctx.translate(bird.x, bird.y);
    var angle = Math.max(-0.5, Math.min(0.9, bird.vy / (H*1.6)));
    gctx.rotate(angle);
    gctx.font = (bird.r * 2.1) + 'px sans-serif';
    gctx.textAlign = 'center';
    gctx.textBaseline = 'middle';
    gctx.fillText(currentEmoji, 0, 0);
    gctx.restore();
  }

  function endRound(){
    running = false;
    if(rafId) cancelAnimationFrame(rafId);
    overlay.classList.remove('hidden');
    playBtn.textContent = 'Play again';
    submitScore(currentProfile, score);
    liveBestEl.textContent = Math.max(score, LB[currentProfile] || 0);
    drawFrame();
  }

  function flap(){
    if(!currentProfile) return;
    if(!started || !running){
      startRound();
      return;
    }
    bird.vy = FLAP_V;
  }

  playBtn.addEventListener('click', function(e){
    e.stopPropagation();
    flap();
  });
  gameWrap.addEventListener('pointerdown', function(e){
    if(e.target === playBtn) return;
    e.preventDefault();
    flap();
  });
  window.addEventListener('keydown', function(e){
    if(e.code === 'Space' && gameArea && !gameArea.hidden){
      e.preventDefault();
      flap();
    }
  });

  initLeaderboard();
})();
</script>
